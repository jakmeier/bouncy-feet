services:
  bouncy_backend:
    # Set by the root-owned deployment helper; never use a mutable image tag here.
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    env_file:
      - /etc/bouncy-feet/production/backend.env
    ports:
      - 3002:3000
    restart: always
    networks:
      - local_network
  postgres:
    image: postgres:17.2
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
    env_file:
      - /etc/bouncy-feet/production/postgres.env
    ports:
      - 65432:5432
    networks:
      - local_network
    restart: always
volumes:
  prod-pgdata:
networks:
  local_network:
    driver: bridge
