name: Dependencies
on:
  pull_request:
    branches: [main, bf, bf-next]
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/deny.toml'
  # Pushes to bf/bf-next are checked by the deployment workflow.
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/deny.toml'
jobs:
  cargo-deny:
    runs-on: bouncy-feet-ci
    steps:
    - uses: actions/checkout@v4
    - run: cargo deny check bans licenses sources