name: Playwright Tests

on:
  # Run dev E2E tests only after a commit has been deployed to dev.
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: "Commit SHA deployed to dev"
        required: true
        type: string
  release:
    types: [ "published" ]

jobs:
  test-dev:
    if: github.event_name == 'workflow_dispatch'
    runs-on: bouncy-feet-ci
    defaults:
      run:
        working-directory: ./bouncy_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the same source revision that was deployed to dev.
          ref: ${{ inputs.deployed_sha }}
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('bouncy_frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e:dev

  test-prod:
    if: github.event_name == 'release'
    runs-on: bouncy-feet-ci
    defaults:
      run:
        working-directory: ./bouncy_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('bouncy_frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e:prod
