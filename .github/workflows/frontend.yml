name: Frontend

on:
  # Pushes to bf/bf-next are checked by the deployment workflow.
  push:
    branches: [main]
    paths:
      - 'bouncy_frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, bf, bf-next]
    paths:
      - 'bouncy_frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  unit-tests:
    runs-on: bouncy-feet-ci
    defaults:
      run:
        working-directory: ./bouncy_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('bouncy_frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run sync
      - run: npm run test:unit -- --run

  translations:
    runs-on: bouncy-feet-ci
    defaults:
      run:
        working-directory: ./bouncy_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('bouncy_frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:i18n
