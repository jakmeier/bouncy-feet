services:
  bouncy_backend_dev:
    # Set by the root-owned deployment helper
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    env_file:
      - /etc/bouncy-feet/test/backend.env
    ports:
      - 3003:3000
    restart: always
    networks:
      - local_dev_network
  postgres:
    image: postgres:17.2
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
    env_file:
      - /etc/bouncy-feet/test/postgres.env
    ports:
      - 65432:5432
    networks:
      - local_dev_network
    restart: always

  # Note: PeerTube uses the compose files from upstream with slight
  # modifications for the machine it is running on.

volumes:
  dev-pgdata:
networks:
  local_dev_network:
    driver: bridge
